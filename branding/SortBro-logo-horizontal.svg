<?xml version="1.0" encoding="UTF-8"?>
<!-- Horisontell lockup för tryck och dokument. Texten är redigerbar text,
     inte konturerad. Byt typsnitt i din tryckredigerare vid behov. -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="128" viewBox="0 0 520 128" role="img" aria-labelledby="h-title">
  <title id="h-title">SortBro – smart mejlsortering</title>
  <g id="mark">
  <title id="title">SortBro</title>
  <desc id="desc">Tre staplade brev i en mörk grön ruta med en mintgrön bock.</desc>
  <defs>
    <linearGradient id="sortbro-bg" x1="18" y1="8" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14524d"/>
      <stop offset="0.55" stop-color="#0b3539"/>
      <stop offset="1" stop-color="#07252b"/>
    </linearGradient>
    <linearGradient id="sortbro-paper" x1="36" y1="30" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5f4ee"/>
    </linearGradient>
    <linearGradient id="sortbro-mint" x1="70" y1="58" x2="108" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62e9b9"/>
      <stop offset="1" stop-color="#1eaa7d"/>
    </linearGradient>
    <filter id="sortbro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#021417" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g id="badge">
    <rect x="1.5" y="1.5" width="125" height="125" rx="29" fill="url(#sortbro-bg)"/>
    <rect x="2.5" y="2.5" width="123" height="123" rx="28" fill="none" stroke="#8fe4c8" stroke-opacity="0.22" stroke-width="1.5"/>
    <path d="M24 24h80" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g id="mail-stack" filter="url(#sortbro-shadow)">
    <!-- Nedre och mellersta brevet: sorteringsdjupet -->
    <rect x="30" y="58" width="70" height="42" rx="8" fill="#1d6c61" stroke="#0a2d30" stroke-width="2"/>
    <rect x="26" y="48" width="70" height="42" rx="8" fill="#35a888" stroke="#0a2d30" stroke-width="2"/>
    <!-- Översta brevet -->
    <rect x="22" y="38" width="70" height="42" rx="8" fill="url(#sortbro-paper)" stroke="#0a2d30" stroke-width="2.5"/>
    <path d="M25 42l32 23 32-23" fill="none" stroke="#17675c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sorteringslinjer håller märket läsbart även i 16 px -->
    <path d="M31 66h24M31 73h15" stroke="#17675c" stroke-width="3.5" stroke-linecap="round" opacity="0.72"/>
  </g>

  <g id="check-badge">
    <circle cx="94" cy="92" r="22" fill="#0a2d30"/>
    <circle cx="94" cy="92" r="19" fill="url(#sortbro-mint)"/>
    <path d="M84.5 92.2l6.8 6.8 13.2-14" fill="none" stroke="#06352d" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
  <g fill="#0b3539" font-family="Segoe UI, system-ui, sans-serif">
    <text x="152" y="66" font-size="42" font-weight="700" letter-spacing="-1">SortBro</text>
    <text x="154" y="90" font-size="13" font-weight="600" letter-spacing="3.2" fill="#2c776c">FÖR THUNDERBIRD</text>
  </g>
</svg>

<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SortBro – mejl före flytt</title>
<link rel="stylesheet" href="reader.css">
<script src="reader.js" defer></script>
</head>
<body>
<header><strong>SortBro</strong><p id="status" role="status">Läser in mejlet. Det flyttas inte medan detta fönster är öppet.</p></header>
<main>
<h1 id="subject">Mejl före flytt</h1>
<p id="from"></p><p id="date"></p>
<p id="note">Säker textvisning – inga externa bilder eller skript laddas.</p>
<pre id="body" tabindex="0" aria-label="Mejltext"></pre>
<p id="attachments"></p>
<p id="error" role="alert" hidden></p>
</main>
<footer><button id="close" type="button">Stäng mejlet</button><span id="copyright">© Rickard Längkvist</span></footer>
</body>
</html>

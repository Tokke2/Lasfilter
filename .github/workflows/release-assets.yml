name: Release assets

# Lägger XPI-filen, kontrollsumman, updates.json och Windows-skriptet som
# bilagor på releasen, så
# att Thunderbird kan uppdatera från /releases/latest/download/... utan att någon
# laddar upp något för hand. Kolla-SortBro-version.bat bara läser – den kan inte
# installera något, den finns med så att den går att hämta från release-sidan.
#
# Två releaser får filerna:
#   1. releasen för den tagg som just pushades (v1.0.1, v1.0.2 …),
#   2. bryggan v1.0.0 – den release som redan installerade kopior pekar på.
#      Utan den skulle en installation av 1.0.0 aldrig se en nyare version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BRIDGE_TAG: v1.0.0

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera att version, hash och adresser hör ihop
        run: python3 tools/verify_release.py

      - name: Lägg filerna på releasen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          upload() {
            tag="$1"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --title "SortBro $tag" --notes "Se LAS-MIG.md i repot."
            fi
            gh release upload "$tag" \
              SortBro-Thunderbird.xpi \
              SortBro-Thunderbird.xpi.sha256 \
              updates.json \
              Kolla-SortBro-version.bat \
              --clobber --repo "$GITHUB_REPOSITORY"
          }
          upload "$TAG"
          if [ "$TAG" != "$BRIDGE_TAG" ]; then upload "$BRIDGE_TAG"; fi
          for tag in "$TAG" "$BRIDGE_TAG"; do
            echo "== $tag =="
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[] | "\(.name) \(.size) \(.digest)"'
          done

      # En tagg som flyttats (samma version, ny commit) gör att GitHub lägger
      # releasen som utkast, och då slutar releases/latest att följa den nya
      # versionen. Publicera den igen och peka "latest" hit. Två anrop: GitHub
      # struntar i make_latest om samma anrop också ändrar draft.
      - name: Publicera releasen och gör den till senaste
        if: github.ref_name != env.BRIDGE_TAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo="$GITHUB_REPOSITORY"
          # PATCH går bara mot release-id, inte mot /releases/tags/<tagg> (404).
          id=$(gh api "repos/$repo/releases/tags/$GITHUB_REF_NAME" --jq .id)
          gh api -X PATCH "repos/$repo/releases/$id" -f draft=false >/dev/null
          gh api -X PATCH "repos/$repo/releases/$id" -f make_latest=true \
            --jq '.tag_name + " ar publicerad och senaste"'
          latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
          echo "releases/latest pekar pa $latest"
          test "$latest" = "$GITHUB_REF_NAME"
